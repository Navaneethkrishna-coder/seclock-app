apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock-app
  labels:
    app: seclock-app
spec:
  replicas: 2                     # one pod per node, adjust as needed
  selector:
    matchLabels:
      app: seclock-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: seclock-app
    spec:
      # Spread the two replicas across your two worker nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - seclock-app
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ecr-registry-secret   # see notes below on how to create this
      containers:
        - name: seclock-app
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/seclock-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080     # <-- change to the port your app listens on
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
