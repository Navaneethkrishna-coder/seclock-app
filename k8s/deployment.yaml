apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock
  labels:
    app: seclock
spec:
  replicas: 2

  selector:
    matchLabels:
      app: seclock

  template:
    metadata:
      labels:
        app: seclock

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: seclock
          image: YOUR_ECR_REPOSITORY/seclock:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: seclock-service
  labels:
    app: seclock

spec:
  selector:
    app: seclock

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

  type: ClusterIP
