apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock
  labels:
    app: seclock
spec:
  replicas: 2                     # one pod per worker node
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: seclock
  template:
    metadata:
      labels:
        app: seclock
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret   # see setup notes: this token expires every 12h
      containers:
        - name: seclock
          image: 859925121963.dkr.ecr.us-east-1.amazonaws.com/fast-api:latest           # Jenkins substitutes this with <account>.dkr.ecr.us-east-1.amazonaws.com/seclock:<tag>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/state
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/state
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: seclock-service
  labels:
    app: seclock
spec:
  type: NodePort            # no cloud LB on a bare kubeadm cluster; swap for LoadBalancer if you add one later
  selector:
    app: seclock
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
