# Keeps `ecr-registry-secret` (used by k8s/deployment.yaml) valid.
# ECR auth tokens expire after 12h, so a plain kubeadm cluster with
# no native AWS integration needs this refreshed on a schedule.
#
# Requires: a ServiceAccount with RBAC to create/update secrets in
# this namespace, and either an IAM instance role on the node this
# runs on, or AWS credentials injected as env vars below.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
roleRef:
  kind: Role
  name: ecr-secret-refresher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
spec:
  schedule: "0 */6 * * *"     # every 6 hours
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          containers:
            - name: ecr-secret-refresh
              image: amazon/aws-cli:2.17.0
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: ECR_REGISTRY
                  value: "859925121963.dkr.ecr.us-east-1.amazonaws.com"   # <-- replace
                # If the node running this pod has no IAM role attached,
                # inject static creds via a Secret instead:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: aws-static-creds, key: access-key-id } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: aws-static-creds, key: secret-access-key } }
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  curl -sLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x /tmp/kubectl
                  TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
                  kubectl create secret docker-registry ecr-registry-secret \
                    --docker-server="$ECR_REGISTRY" \
                    --docker-username=AWS \
                    --docker-password="$TOKEN" \
                    --dry-run=client -o yaml | /tmp/kubectl apply -f -
